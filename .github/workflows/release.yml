name: Build & release binaries

# Builds a double-click executable of My Jarvis and publishes it to a GitHub
# Release.
#
# Windows only, deliberately. My Jarvis drives the machine it runs on --
# global hotkeys through `keyboard`, mouse and keyboard control through
# `pyautogui`, screen capture, SAPI speech. On macOS those need accessibility
# and screen-recording permissions that an unsigned onefile binary cannot
# request coherently, and on Linux `keyboard` needs root. Both platforms are
# covered by install.sh, which is a single command and does not have these
# problems.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.8.0). Leave empty for a build-only test run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Voice input is the one dependency that is not in requirements.txt,
      # because a source build of it fails on plenty of machines. The
      # Windows wheel installs cleanly, so the packaged build gets it.
      - name: Install PyAudio (best effort)
        shell: bash
        run: pip install pyaudio || echo "PyAudio unavailable; the build falls back to sounddevice"

      # Two more optional integrations that the spec lists as hidden imports
      # but requirements.txt deliberately leaves out, because neither is
      # needed to run My Jarvis. Installing them here means the packaged
      # build ships them; a failure here is not a failure of the build.
      - name: Install the remaining optional integrations (best effort)
        shell: bash
        run: |
          pip install pvporcupine || echo "pvporcupine unavailable; wake word falls back to speech_recognition"
          pip install phue || echo "phue unavailable; Hue control stays off in this build"

      - name: Build
        run: pyinstaller packaging/jarvis.spec --noconfirm --clean

      # PyInstaller reports a missing hidden import as an error line but still
      # exits 0, so a "successful" step can leave no executable behind. Check.
      - name: Check the executable exists
        shell: bash
        run: |
          test -f dist/jarvis/jarvis.exe || { echo "::error::pyinstaller produced no dist/jarvis/jarvis.exe"; exit 1; }
          ls -lh dist/jarvis/jarvis.exe

      # A hidden import that silently resolved to nothing would ship a binary
      # missing features the source install has. Fail loudly instead.
      - name: Verify the optional integrations got bundled
        shell: bash
        run: |
          MISSING=0
          for mod in anthropic openai google.generativeai speech_recognition \
                     pyautogui keyboard keyring pdfplumber feedparser notion_client; do
            if ! python -c "import $mod" 2>/dev/null; then
              echo "::warning::$mod is not installed on the runner, so it is not in the binary"
              MISSING=$((MISSING+1))
            fi
          done
          echo "$MISSING optional integrations missing from this build"

      # The build ships as a zipped folder rather than a single self-extracting
      # executable. Onefile packing unpacks itself into %TEMP% at every start,
      # which is what a dropper does: Defender's ML model flagged the v2.8.2
      # download as Trojan:Win32/Sabsik.TE.A!ml on that basis. A folder build
      # costs one unpacking step and removes the behaviour being flagged.
      - name: Package the folder build for release
        shell: bash
        run: |
          mv dist/jarvis dist/my-jarvis
          powershell -Command "Compress-Archive -Path 'dist/my-jarvis' -DestinationPath 'my-jarvis-windows-x64.zip' -CompressionLevel Optimal"
          test -f my-jarvis-windows-x64.zip || { echo "::error::no zip produced"; exit 1; }
          ls -lh my-jarvis-windows-x64.zip

      - name: Checksum
        shell: bash
        run: |
          FILE="my-jarvis-windows-x64.zip"
          certutil -hashfile "$FILE" SHA256 | sed -n '2p' | tr -d '\r' | awk -v f="$FILE" '{print $0"  "f}' > "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: my-jarvis-windows-x64
          path: |
            my-jarvis-windows-x64.zip
            my-jarvis-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # A dispatch without a tag is a build-only test run: it produces the
    # workflow artifact so the build can be verified, and publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: My Jarvis ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          body: |
            Windows build of My Jarvis ${{ steps.version.outputs.version }}.
            No Python installation required — download
            `my-jarvis-windows-x64.zip`, unpack it, and run `jarvis.exe`
            from the folder. Keep the folder together: `jarvis.exe` loads the
            rest of it at startup.

            On macOS and Linux, use the one-line install from the
            [README](https://github.com/${{ github.repository }}#readme)
            instead. My Jarvis needs accessibility and input permissions that
            an unsigned binary cannot request properly on those platforms.

            This binary is **not code-signed**, so your browser may warn while
            downloading it, and Windows SmartScreen will warn on first launch —
            choose *Keep* and then *More info → Run anyway*.

            **On antivirus warnings.** v2.8.2 shipped as a single
            self-extracting `.exe`, and Microsoft Defender's machine-learning
            model flagged it as `Trojan:Win32/Sabsik.TE.A!ml` — a false
            positive, but an understandable one: that packing format unpacks
            itself into `%TEMP%` at every start, the same way a dropper does.
            This release is a plain folder instead, which removes that
            behaviour. If a scanner still objects, every build is produced in
            public from public source — the workflow run is linked on this
            page, and the `SHA256SUMS.txt` below lets you check that what you
            downloaded is what it built.

            You still need an API key from one of the supported providers, or
            a local Ollama model. Whatever you send My Jarvis — screenshots
            included — goes to the provider you configure.

            Verify a download against `SHA256SUMS.txt`:

            ```
            sha256sum -c SHA256SUMS.txt
            ```
